name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build
        run: |
          version="${GITHUB_REF_NAME#v}"
          for arch in amd64:x86_64 arm64:aarch64; do
            goarch="${arch%%:*}"
            name="${arch##*:}"
            mkdir -p "dist/$name"
            CGO_ENABLED=0 GOOS=linux GOARCH="$goarch" go build -trimpath \
              -ldflags "-s -w -X main.version=$version" -o "dist/$name/sinty-flash" ./cmd/sinty-flash
            tar -C "dist/$name" -czf "sinty-flash-${GITHUB_REF_NAME}-$name.tar.gz" sinty-flash
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
